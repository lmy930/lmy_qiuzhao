<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 秋招雷达</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152238}.wrap{max-width:1250px;margin:auto;padding:25px}header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:29px}p{color:#64748b}.panel,.tile{background:white;border:1px solid #e3e8ef;border-radius:15px;padding:18px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile strong{display:block;font-size:27px}.tile small{color:#64748b}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:10px;border:1px solid #dce3eb;border-radius:9px;background:white}input{flex:1;min-width:200px}button{cursor:pointer}button:hover{background:#eef4ff}.calhead{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:#718096;font-size:12px;padding:10px}.day{border:1px solid #e7ecf2;border-radius:8px;min-height:82px;padding:6px;overflow:hidden}.outside{opacity:.35}.today{border:2px solid #4c6fff}.event{font-size:11px;background:#e9f2ff;border-radius:4px;padding:3px;margin-top:3px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.muted{color:#64748b}.tablebox{max-height:550px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e9edf3;padding:10px}th{position:sticky;top:0;background:white}a{color:#285ec7}#detail{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px}#detail.show{display:flex}.modal{background:white;padding:24px;border-radius:16px;width:min(520px,100%)}.tip{font-size:13px;background:#fff8e8;border:1px solid #f8e1aa;padding:12px;border-radius:9px;margin:14px 0}@media(max-width:650px){.wrap{padding:13px}h1{font-size:23px}.day{min-height:65px;padding:3px}.stats{gap:6px}.tile{padding:10px}.tile strong{font-size:21px}.calendar{gap:2px}}
</style></head><body><div class="wrap"><header><div><h1>2027 秋招雷达</h1><p>央企 · 银行 · 民营500强 · 秋招开启日历</p></div><span id="updated" class="muted"></span></header><div class="tip">网站已部署初版。企业名单正在分批导入，招聘状态与开放日期必须核对官方公告后才显示；“待核验”不等于未招聘。每日自动核验尚在配置中。</div><section class="stats"><div class="tile"><strong id="total">—</strong><small>已导入企业</small></div><div class="tile"><strong id="open">—</strong><small>已核实开启</small></div><div class="tile"><strong id="pending">—</strong><small>待核验</small></div></section><section class="panel controls"><input id="query" placeholder="搜索企业名称"><select id="group"><option value="">全部类别</option><option>央企</option><option>银行</option><option>民营500</option></select><select id="status"><option value="">全部状态</option><option>已开启</option><option>即将开启</option><option>已结束</option><option>待核验</option></select></section><section class="panel"><div class="calhead"><h2 id="month"></h2><div><button onclick="move(-1)">←</button><button onclick="reset()">今天</button><button onclick="move(1)">→</button></div></div><div id="calendar" class="calendar"></div></section><section class="panel"><h2>企业列表</h2><div class="tablebox"><table><thead><tr><th>企业</th><th>类别</th><th>状态</th><th>开启日期</th><th>截止日期</th><th>官方来源 / 网申</th></tr></thead><tbody id="rows"></tbody></table></div></section><p style="font-size:12px">招聘信息以企业官方公告为准；首次开启日期与公告发现日期严格区分，未经核实不填入日历。</p></div><div id="detail" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal"><button style="float:right" onclick="document.getElementById('detail').classList.remove('show')">关闭</button><div id="detailContent"></div></div></div><script>
let companies=[],cursor=new Date();cursor.setDate(1);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function filtered(){let q=$('query').value.trim().toLowerCase(),g=$('group').value,s=$('status').value;return companies.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!g||c.groups.includes(g))&&(!s||c.status===s))}function render(){let x=filtered();$('total').textContent=companies.length;$('open').textContent=companies.filter(c=>c.status==='已开启').length;$('pending').textContent=companies.filter(c=>c.status==='待核验').length;$('rows').innerHTML=x.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.groups.join('、'))+'</td><td>'+esc(c.status)+'</td><td>'+esc(c.open_date||'—')+'</td><td>'+esc(c.deadline||'—')+'</td><td>'+(c.source_url?'<a target="_blank" rel="noopener" href="'+encodeURI(c.source_url)+'">公告</a>':'—')+(c.apply_url?' · <a target="_blank" rel="noopener" href="'+encodeURI(c.apply_url)+'">网申</a>':'')+'</td></tr>').join('');renderCal(x)}function renderCal(x){let y=cursor.getFullYear(),m=cursor.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),html='';$('month').textContent=y+'年'+(m+1)+'月';for(let d of '日一二三四五六')html+='<div class="dow">周'+d+'</div>';for(let i=0;i<42;i++){let d=i-first+1,date=new Date(y,m,d),iso=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-'),inMonth=d>=1&&d<=days;html+='<div class="day'+(inMonth?'':' outside')+'"><small>'+date.getDate()+'</small>';for(let c of x.filter(z=>z.open_date===iso).slice(0,5))html+='<div class="event" title="'+esc(c.name)+'" data-name="'+esc(c.name)+'">'+esc(c.name)+'</div>';html+='</div>'} $('calendar').innerHTML=html;document.querySelectorAll('.event').forEach(el=>el.addEventListener('click',()=>{let c=companies.find(c=>c.name===el.dataset.name);$('detailContent').innerHTML='<h2>'+esc(c.name)+'</h2><p>状态：'+esc(c.status)+'</p><p>开启：'+esc(c.open_date||'待核验')+'</p><p>截止：'+esc(c.deadline||'待核验')+'</p>'+(c.source_url?'<p><a target="_blank" rel="noopener" href="'+encodeURI(c.source_url)+'">官方招聘公告</a></p>':'');$('detail').classList.add('show')}))}function move(n){cursor.setMonth(cursor.getMonth()+n);render()}function reset(){cursor=new Date();cursor.setDate(1);render()}['query','group','status'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));fetch('data/companies.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error('暂无数据');return r.json()}).then(d=>{companies=d.companies||[];$('updated').textContent='数据版本：'+(d.generated_at||'待核验');render()}).catch(e=>{$('updated').textContent='数据读取失败：'+e.message;render()});
</script></body></html>
