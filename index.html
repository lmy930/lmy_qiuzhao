<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027秋招企业看板</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#17243a}.wrap{max-width:1150px;margin:auto;padding:22px}h1{margin:0;font-size:30px}p,.muted{color:#64748b}.muted{font-size:13px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:19px;margin-top:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #d4deeb;border-radius:9px;padding:10px;background:white}input{flex:1;min-width:180px}button{cursor:pointer}.actions,.tracker-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}.actions button.active{background:#eaf0ff;border-color:#4d6fd7}.tracker-tools{margin-top:12px}.tracker-tools button{font-size:13px}.notice{font-size:13px;color:#765422}.application-state{font-size:12px;color:#48614d}.section-empty{padding:14px;background:#f7f9fc;border-radius:9px;line-height:1.7}button:focus-visible,select:focus-visible{outline:2px solid #4d6fd7;outline-offset:2px}@media(max-width:650px){.wrap{padding:10px}h1{font-size:23px}}
.category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.category-tabs button{border:0;background:#f0f3f8;color:#465873;font-weight:600;padding:12px 18px}.category-tabs button[aria-pressed="true"]{background:#203b6b;color:white}.category-tabs span{margin-left:7px;opacity:.8;font-size:13px}.board-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.board-toolbar label{font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px}.board-summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:#64748b;font-size:13px;margin:18px 0}.board-summary b{color:#203b6b}.legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}.legend-dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:6px}.baseline-dot{background:#94a3b8}.new-dot{background:#ed9c2c}.company-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.company-card{display:flex;flex-direction:column;gap:16px;border:1px solid #e0e6ef;border-left:4px solid #a7b5c9;border-radius:12px;padding:18px;background:#fff;min-width:0}.company-card.new-company{background:#fffbf2;border-color:#f1d498;border-left-color:#df8a19}.company-card.ended{background:#f7f8fa}.card-heading{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.card-heading b{font-size:16px;line-height:1.6;overflow-wrap:anywhere}.new-badge{white-space:nowrap;font-size:11px;background:#fce6b9;color:#90500d;padding:4px 7px;border-radius:6px}.source-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.evidence-warning{color:#93601d}.source-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.source-links a{color:#24528b;font-size:13px;text-underline-offset:3px}.card-meta{font-size:12px;color:#64748b;margin-top:8px;line-height:1.8}.company-card .actions{margin-top:auto;border-top:1px solid #e8edf4;padding-top:12px}.company-card .actions .application-state{margin-right:auto}.board-explanation{font-size:12px;line-height:1.8;margin-bottom:0}.board-footer{margin-top:25px;line-height:1.6}.board-footer p{font-size:12px;margin:5px 0}.company-grid>.section-empty{grid-column:1/-1}#scanNotice:empty,#dataNotice:empty,#baselineWarning:empty{display:none}@media(max-width:650px){.company-grid{grid-template-columns:1fr}.category-tabs{gap:5px}.category-tabs button{padding:10px 12px}.category-tabs span{margin-left:4px}.legend{margin-left:0}.company-card{padding:15px}.board-toolbar input{flex-basis:100%;min-width:0}.board-toolbar select{padding:8px}.board-summary{gap:10px}.tracker-tools{gap:7px}.tracker-tools>span:first-child{width:100%}}
</style></head><body><main class="wrap"><header><div><h1>秋招企业看板</h1><p>2027届 · 招聘动态与投递记录，新确认的企业优先展示</p></div><button id="refreshNow" type="button">刷新结果</button></header>
<section class="panel dashboard" aria-label="已开启企业看板">
<nav class="category-tabs" aria-label="企业类别"><button type="button" data-category="" aria-pressed="true">全部 <span id="categoryAll">—</span></button><button type="button" data-category="银行" aria-pressed="false">银行 <span id="categoryBanks">—</span></button><button type="button" data-category="央企" aria-pressed="false">央企 <span id="categoryCentral">—</span></button><button type="button" data-category="民营500" aria-pressed="false">民营500 <span id="categoryPrivate">—</span></button></nav>
<div class="board-toolbar"><input id="boardQuery" type="search" aria-label="搜索已开启企业" placeholder="搜索企业名称"><label>范围 <select id="boardRange"><option value="all">全部已确认</option><option value="new">后来新确认</option><option value="baseline">首次基线</option></select></label><label>投递 <select id="applicationFilter"><option value="all">全部状态</option><option value="pending">未投递</option><option value="applied">已投递</option><option value="later">暂不投</option></select></label><label>招聘 <select id="recruitmentFilter"><option value="all">全部招聘状态</option><option value="open">有网申开启依据</option><option value="unknown">报名情况待核实</option><option value="ended">已记录结束</option><option value="evidence">正文证据待补齐</option></select></label></div>
<div class="board-summary"><span>显示 <b id="visibleCount">—</b> 家</span><span>未标记投递 <b id="pendingCount">—</b> 家</span><div class="legend"><span><i class="legend-dot baseline-dot"></i>首次基线</span><span><i class="legend-dot new-dot"></i>后来新确认 <b id="boardNew">—</b></span></div></div>
<p id="coverageNotice" class="muted board-explanation"></p><p id="scanNotice" class="notice" role="status"></p><p id="dataNotice" class="notice" role="status"></p><p id="baselineWarning" class="notice" role="status"></p>
<div id="applicationList" class="company-grid" aria-live="polite"></div>
<p class="muted board-explanation">橙色表示建立基线后新确认的企业，不代表当天才开始招聘。集团旗下单位、已结束和报名状态待核实会分别标明。</p>
</section>
<div class="tracker-tools"><span id="trackingNote" class="muted">投递标记保存在此浏览器，按集团/企业记录；不同设备不会自动同步。</span><button id="exportTracker">备份记录</button><button id="importTracker">恢复记录</button><input type="file" id="trackerFile" accept="application/json,.json" hidden><span id="trackingMessage" class="notice" role="status"></span></div>
<footer class="board-footer"><p class="muted" id="baselineNote"></p><p class="muted" id="updated"></p><p class="muted" id="health"></p><p class="muted">每日北京时间 10:00、22:00 自动开始检查，核验与发布完成后更新。</p></footer></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let companies=[],companiesStatus="loading";
const launched=c=>c.status==="已开启"||c.status==="已结束"||c.status==="已发布公告（网申待核验）";
function render(){renderDashboard()}

const TRACKER_KEY="qiuzhao-2027-tracker-v1";
const validState=new Set(["applied","later"]);
let storageAvailable=true,tracker=readTracker();
function validateTracker(raw){
 if(!raw||raw.version!==1||typeof raw.applications!=="object"||raw.applications===null||Array.isArray(raw.applications)||!Array.isArray(raw.read_updates))throw Error("备份格式不正确");
 const clean={version:1,applications:Object.create(null),read_updates:[]};
 for(const [name,value] of Object.entries(raw.applications)){
  if(typeof name!=="string"||name.length>150||!value||!validState.has(value.state)||(typeof value.marked_at!=="string"||!Number.isFinite(Date.parse(value.marked_at))))throw Error("投递记录格式不正确");
  clean.applications[name]={state:value.state,marked_at:value.marked_at};
 }
 if(raw.read_updates.some(x=>typeof x!=="string"||x.length>400))throw Error("更新记录格式不正确");
 clean.read_updates=[...new Set(raw.read_updates)];return clean;
}
function readTracker(){try{const storage=globalThis.localStorage;storageAvailable=Boolean(storage);const raw=storage?.getItem(TRACKER_KEY);if(raw)return validateTracker(JSON.parse(raw))}catch(e){storageAvailable=false}return {version:1,applications:Object.create(null),read_updates:[]}}
function saveTracker(){
 try{if(!storageAvailable)throw Error("storage unavailable");globalThis.localStorage.setItem(TRACKER_KEY,JSON.stringify(tracker))}
 catch(e){storageAvailable=false;$("trackingMessage").textContent="记录暂时只能保留在当前页面，请导出备份。"}
}
const appliedState=name=>tracker.applications[name]?.state||"pending";
let baselineNames=new Set(),baselineStatus="loading",baselineCapturedAt="",boardCategory="";
const newlyConfirmed=c=>baselineStatus==="ready"&&launched(c)&&!baselineNames.has(c.name);
function safeLink(value){try{const url=new URL(value);return url.protocol==="https:"&&!url.username&&!url.password?url.href:""}catch{return ""}}
function recruitmentMatches(c,filter){return filter==="all"||filter==="open"&&c.status==="已开启"||filter==="unknown"&&c.status==="已发布公告（网申待核验）"||filter==="ended"&&c.status==="已结束"||filter==="evidence"&&!c.page_verification?.sha256}
function companyRow(c){
 const state=appliedState(c.name),fresh=newlyConfirmed(c),ended=c.status==="已结束",child=["subsidiary","旗下单位"].includes(c.source_scope);
 const scope=child?"旗下单位已启动":"已确认2027届招聘";
 const availability=ended?"已记录结束":c.status==="已开启"?"已有网申开启依据，不能保证全部岗位仍在报名":"已有招聘公告，当前可报名情况待自动核实";
 const name=encodeURIComponent(c.name);
 const evidence=c.page_verification||{},source=safeLink(evidence.url||c.announcement_source_url||c.source_url);
 const channel=(c.application_channels||[]).find(ch=>ch.company===c.name&&ch.proof_sha256&&safeLink(ch.proof_url)&&safeLink(ch.url)),portal=channel?safeLink(channel.url):"";
 const detail=(evidence.title?'<div class="source-title">'+esc(evidence.title)+'</div>':'')+(!evidence.sha256?'<div class="evidence-warning">历史记录：完整正文证据待自动补齐</div>':'');
 const links='<div class="source-links">'+(source?'<a href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">查看招聘公告 ↗</a>':'')+(portal?'<a href="'+esc(portal)+'" target="_blank" rel="noopener noreferrer">'+(channel.scope==="subsidiary"?'旗下单位网申入口':'网申入口')+' ↗</a>':'')+'</div>';
 return '<article class="company-card'+(fresh?' new-company':'')+(ended?' ended':'')+'" data-name="'+esc(c.name)+'"><div><div class="card-heading"><b>'+esc(c.name)+'</b>'+(fresh?'<span class="new-badge">新确认</span>':'')+'</div><div class="card-meta">'+esc(c.groups.join(" · "))+' · '+esc(scope)+'<br>'+esc(availability)+detail+'</div>'+links+'</div><div class="actions"><span class="application-state">'+(state==="applied"?"已投递":state==="later"?"暂不投":"未投递")+'</span><button data-action="applied" data-company="'+name+'"'+(state==="applied"?' class="active"':'')+'>标记已投递</button><button data-action="later" data-company="'+name+'"'+(state==="later"?' class="active"':'')+'>暂不投</button>'+(state!=="pending"?'<button data-action="pending" data-company="'+name+'">改回未投递</button>':'')+'</div></article>';
}
function renderDashboard(){
 if(companiesStatus!=="ready"){
  for(const id of ["categoryAll","categoryBanks","categoryCentral","categoryPrivate","boardNew","pendingCount","visibleCount"])$(id).textContent="—";
  $("applicationList").innerHTML='<p class="section-empty">'+(companiesStatus==="failed"?"企业结果暂未加载成功，请稍后刷新。已有投递记录不会丢失。":"正在读取企业结果…")+'</p>';
  return;
 }
 const confirmed=companies.filter(launched);
 $("coverageNotice").textContent="监控 "+companies.length+" 家，仍有 "+(companies.length-confirmed.length)+" 家待核验；待核验不代表未开招。名单不保证完整，也不代表全部仍可投递。";
 for(const [category,id] of [["","categoryAll"],["银行","categoryBanks"],["央企","categoryCentral"],["民营500","categoryPrivate"]])$(id).textContent=confirmed.filter(c=>!category||c.groups.includes(category)).length;
 const categoryCompanies=confirmed.filter(c=>!boardCategory||c.groups.includes(boardCategory));
 $("boardNew").textContent=baselineStatus==="ready"?categoryCompanies.filter(newlyConfirmed).length:"—";
 $("pendingCount").textContent=categoryCompanies.filter(c=>c.status!=="已结束"&&appliedState(c.name)==="pending").length;
 const range=$("boardRange").value||"all",state=$("applicationFilter").value||"all",query=$("boardQuery").value.trim().toLowerCase(),recruitment=$("recruitmentFilter").value||"all";
 let list=categoryCompanies.filter(c=>recruitmentMatches(c,recruitment)&&(!query||c.name.toLowerCase().includes(query))&&(state==="all"||appliedState(c.name)===state&&(state!=="pending"||c.status!=="已结束"))&&(range==="all"||baselineStatus==="ready"&&(range==="new"?newlyConfirmed(c):baselineNames.has(c.name))));
 list.sort((a,b)=>Number(newlyConfirmed(b))-Number(newlyConfirmed(a))||Number(a.status==="已结束")-Number(b.status==="已结束")||Number(b.status==="已开启")-Number(a.status==="已开启")||a.name.localeCompare(b.name,"zh-CN"));
 $("visibleCount").textContent=list.length;
 $("applicationList").innerHTML=list.length?list.map(companyRow).join(""):'<p class="muted section-empty">'+(baselineStatus!=="ready"&&range!=="all"?"基线暂未读取，无法区分新旧企业。请刷新结果。":"这个筛选下暂无已确认企业。未确认不代表尚未开招。")+'</p>';
 $("baselineWarning").textContent=baselineStatus==="failed"?"基线暂未读取成功，新旧标记暂不可用；已有企业和投递记录仍可查看。":"";
 $("baselineNote").textContent=baselineStatus==="ready"?"首次基线：已确认的 "+baselineNames.size+" 家企业。基线固定，后续自动更新不会重置颜色。":"";
 if(!storageAvailable)$("trackingNote").textContent="浏览器暂不能保存记录；关闭页面前请备份记录。";
}
async function loadBaseline(){
 try{
  const response=await fetch("./data/launch_baseline.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("基线 HTTP "+response.status);const data=await response.json();
  if(data.schema_version!==1||!Array.isArray(data.known_launch_names)||data.known_launch_names.some(x=>typeof x!=="string")||typeof data.captured_at!=="string")throw Error("基线格式错误");
  baselineNames=new Set(data.known_launch_names);baselineCapturedAt=data.captured_at;baselineStatus="ready";
 }catch(error){baselineStatus="failed"}
 renderDashboard();
}
function handleApplicationClick(event){
 const button=event.target.closest?.("button[data-action]");if(!button)return;
 const name=decodeURIComponent(button.dataset.company),state=button.dataset.action;
 if(!companies.some(c=>c.name===name)||!["pending","applied","later"].includes(state))return;
 if(state==="pending")delete tracker.applications[name];else tracker.applications[name]={state,marked_at:new Date().toISOString()};
 saveTracker();renderDashboard();
}
for(const id of ["applicationList"])$(id).addEventListener("click",handleApplicationClick);
$("applicationFilter").addEventListener("change",renderDashboard);$("recruitmentFilter").addEventListener("change",renderDashboard);
$("boardRange").addEventListener("change",renderDashboard);$("boardQuery").addEventListener("input",renderDashboard);
document.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>{boardCategory=button.dataset.category;document.querySelectorAll("[data-category]").forEach(item=>item.setAttribute("aria-pressed",String(item.dataset.category===boardCategory)));renderDashboard()}));
$("exportTracker").onclick=()=>{const blob=new Blob([JSON.stringify(tracker,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="2027秋招投递记录.json";link.click();URL.revokeObjectURL(url)};
$("importTracker").onclick=()=>$("trackerFile").click();
$("trackerFile").addEventListener("change",async event=>{
 try{const file=event.target.files?.[0];if(!file)return;if(file.size>1024*1024)throw Error("备份文件过大");const incoming=validateTracker(JSON.parse(await file.text()));
  const merged={...tracker.applications};for(const [name,value] of Object.entries(incoming.applications)){const old=merged[name];if(!old||Date.parse(value.marked_at)>=Date.parse(old.marked_at))merged[name]=value}
  tracker.applications=merged;tracker.read_updates=[...new Set([...tracker.read_updates,...incoming.read_updates])];saveTracker();renderDashboard();$("trackingMessage").textContent=storageAvailable?"已合并投递记录，保留较新的标记。":"已导入；浏览器无法保存，请保留备份。";
 }catch(error){$("trackingMessage").textContent="导入失败："+error.message}finally{event.target.value=""}
});
globalThis.addEventListener?.("storage",event=>{if(event.key===TRACKER_KEY){tracker=readTracker();renderDashboard()}});

let inflight=false;
async function loadLatest(){
 if(inflight)return;
 inflight=true;
 const btn=$("refreshNow");btn.disabled=true;btn.textContent="正在获取…";
 try{
  // GitHub Pages static data is the stable daily snapshot; cache-bust each visit.
  const response=await fetch("./data/companies.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("站点数据 HTTP "+response.status);
  const data=await response.json();
  if(!Array.isArray(data.companies)||data.companies.length<1)throw Error("企业数据为空");
  companies=data.companies;companiesStatus="ready";$("dataNotice").textContent="";
  $("updated").textContent="最新数据："+(data.generated_at||"未知")+" · 本次读取 "+new Date().toLocaleTimeString("zh-CN",{timeZone:"Asia/Shanghai"});
  render();
 }catch(err){
  // Alternate source if Pages deployment/CDN is temporarily unavailable.
  try{
   const response=await fetch("https://api.github.com/repos/lmy930/lmy_qiuzhao/contents/data/companies.json?ref=main&t="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
   if(!response.ok)throw Error("备选数据 HTTP "+response.status);
   const raw=await response.json();
   const data=raw.companies?raw:JSON.parse(decodeURIComponent(Array.from(atob(raw.content.replace(/\s/g,"")),ch=>"%"+ch.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
   if(!Array.isArray(data.companies)||!data.companies.length)throw Error("备选数据为空");
   companies=data.companies;companiesStatus="ready";$("dataNotice").textContent="";
   $("updated").textContent="已从备选源加载："+(data.generated_at||"未知");
   $("health").textContent="网站数据读取暂时失败，已切换 GitHub 数据源。";
   render();
  }catch(fallback){
   $("health").textContent="数据未能加载："+err.message+"；备选也失败："+fallback.message+"。请稍后重试。";
   companiesStatus=companies.length?"ready":"failed";$("dataNotice").textContent=companies.length?"更新暂未读取成功，当前显示本页已保存的企业结果。":"企业结果和备选来源均未读取成功。";renderDashboard();

  }
 }finally{inflight=false;btn.disabled=false;btn.textContent="刷新结果"}
}
$("refreshNow").onclick=async()=>{await loadLatest();await loadBaseline();await loadScanHealth()};
renderDashboard();
loadLatest();loadBaseline();loadScanHealth();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadLatest();loadScanHealth()}});
setInterval(()=>{if(!document.hidden){loadLatest();loadScanHealth()}},120000);
async function loadScanHealth(){
 try{
  const response=await fetch("./data/page_verification_report.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("扫描报告未读取");const report=await response.json();
  if(!report.scanned_at)throw Error("扫描报告缺少日期");
  const checked=new Date(report.scanned_at),date=checked.toLocaleDateString("en-CA",{timeZone:"Asia/Shanghai"}),stamp=checked.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"});
  $("health").textContent="最近核验："+stamp+"（北京时间）。未发现记录不代表企业没有招聘。";
  $("scanNotice").textContent=report.pages_attempted>0&&report.pages_read===0?"最近核验未能读取来源页面；当前显示已保存结果，自动更新暂受影响。":date!==new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Shanghai"})?"今天的核验结果尚未更新，当前展示最近保存的信息。":report.pages_read<report.pages_attempted?"部分来源暂未读取成功，已保留既有信息。":"";
 }catch(error){$("scanNotice").textContent="暂未读取核验进度，当前展示已保存信息。";$("health").textContent="核验报告暂未读取成功。"}
}
</script></body></html>
