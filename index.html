*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#17243a}.wrap{max-width:1150px;margin:auto;padding:22px}h1{margin:0}p,.sub{color:#64748b}.panel,.stat{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:19px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:30px}.stat small{color:#64748b}.newcount{display:block;color:#8d5718;font-size:11px;margin-top:5px}.day{font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #d4deeb;border-radius:9px;padding:10px;background:white}input{flex:1;min-width:180px}button{cursor:pointer}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;padding:10px 0;color:#64748b;font-size:12px}.day{width:100%;height:91px;text-align:left;background:white;overflow:hidden;border:1px solid #e4eaf2;border-radius:8px;padding:7px;cursor:pointer}.day:hover,.day:focus-visible{background:#eef3ff}.day.selected{border:2px solid #4d6fd7;background:#eaf0ff}.day.out{opacity:.38}.count{display:block;font-size:12px;color:#1d57be;margin-top:7px;font-weight:600}.names{display:block;font-size:11px;color:#53617b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.result{border-bottom:1px solid #e8edf4;padding:12px 4px;display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{font-size:13px;color:#64748b}.tag{font-size:12px;color:#4b5d76;background:#f0f3f8;padding:5px 8px;border-radius:8px}.tip{font-size:13px;background:#eef5ff;border-radius:9px;padding:12px;margin:16px 0;color:#3d587f}.buttonline{display:flex;gap:6px}#list{max-height:400px;overflow:auto}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.day{height:63px;padding:4px}.names{display:none}h1{font-size:23px}.stat{padding:12px}.stat strong{font-size:23px}}

.dashboard{margin-top:18px}.dashboard h2{margin:0 0 10px}.dashboard-head,.actions,.tracker-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dashboard-head{justify-content:space-between}.daily-stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.daily-stats span{background:#eef5ff;border-radius:9px;padding:10px}.daily-stats b{color:#1d57be;font-size:22px;margin-right:5px}.update-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.update-columns h3{font-size:17px}.actions button{padding:7px 10px;font-size:13px}.actions button.active{background:#eaf0ff;border-color:#4d6fd7}.fresh{color:#ad5b04;background:#fff2d8}.result{flex-wrap:wrap}.result-name{flex:1;min-width:180px}.result-meta{margin-top:5px;line-height:1.6}.section-empty{padding:14px;background:#f7f9fc;border-radius:9px;line-height:1.7}.directory{margin-top:20px}.directory>summary{cursor:pointer;padding:15px;border:1px solid #e1e7ef;background:white;border-radius:12px;font-weight:600}.tracker-tools{margin-top:12px}.tracker-tools button{font-size:13px}.dashboard-list{max-height:560px;overflow:auto}.notice{font-size:13px;color:#765422}.application-state{font-size:12px;color:#48614d}.read-button{font-size:13px}button:focus-visible,select:focus-visible{outline:2px solid #4d6fd7;outline-offset:2px}@media(max-width:650px){.update-columns{grid-template-columns:1fr}.daily-stats{gap:6px}.daily-stats span{font-size:12px;padding:8px}.result-name{min-width:150px}}

.category-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.category-tabs button{border:0;background:#f0f3f8;color:#465873;font-weight:600;padding:12px 18px}.category-tabs button[aria-pressed="true"]{background:#203b6b;color:white}.category-tabs span{margin-left:7px;opacity:.8;font-size:13px}.board-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.board-toolbar label{font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px}.board-summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:#64748b;font-size:13px;margin:18px 0}.board-summary b{color:#203b6b}.legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}.legend-dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:6px}.baseline-dot{background:#94a3b8}.new-dot{background:#ed9c2c}.company-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.company-card{display:flex;flex-direction:column;gap:16px;border:1px solid #e0e6ef;border-left:4px solid #a7b5c9;border-radius:12px;padding:18px;background:#fff;min-width:0}.company-card.new-company{background:#fffbf2;border-color:#f1d498;border-left-color:#df8a19}.company-card.ended{background:#f7f8fa}.card-heading{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.card-heading b{font-size:16px;line-height:1.6;overflow-wrap:anywhere}.new-badge{white-space:nowrap;font-size:11px;background:#fce6b9;color:#90500d;padding:4px 7px;border-radius:6px}.card-meta{font-size:12px;color:#64748b;margin-top:8px;line-height:1.8}.company-card .actions{margin-top:auto;border-top:1px solid #e8edf4;padding-top:12px}.company-card .actions .application-state{margin-right:auto}.board-explanation{font-size:12px;line-height:1.8;margin-bottom:0}.board-footer{margin-top:25px;line-height:1.6}.board-footer p{font-size:12px;margin:5px 0}.company-grid>.section-empty{grid-column:1/-1}#scanNotice:empty,#baselineWarning:empty{display:none}@media(max-width:650px){.company-grid{grid-template-columns:1fr}.category-tabs{gap:5px}.category-tabs button{padding:10px 12px}.category-tabs span{margin-left:4px}.legend{margin-left:0}.company-card{padding:15px}.board-toolbar input{flex-basis:100%;min-width:0}.board-toolbar select{padding:8px}.board-summary{gap:10px}.tracker-tools{gap:7px}.tracker-tools>span:first-child{width:100%}}
</style></head><body><main class="wrap"><header><div><h1>秋招企业看板</h1><p>2027届 · 已确认启动的企业，一眼找到还没投的</p></div><button id="refreshNow" type="button">刷新结果</button></header>
<section class="panel dashboard" aria-label="已开启企业看板">
<nav class="category-tabs" aria-label="企业类别"><button type="button" data-category="" aria-pressed="true">全部 <span id="categoryAll">—</span></button><button type="button" data-category="银行" aria-pressed="false">银行 <span id="categoryBanks">—</span></button><button type="button" data-category="央企" aria-pressed="false">央企 <span id="categoryCentral">—</span></button><button type="button" data-category="民营500" aria-pressed="false">民营500 <span id="categoryPrivate">—</span></button></nav>
<div class="board-toolbar"><input id="boardQuery" type="search" aria-label="搜索已开启企业" placeholder="搜索企业名称"><label>范围 <select id="boardRange"><option value="all">全部已确认</option><option value="new">后来新确认</option><option value="baseline">首次基线</option></select></label><label>投递 <select id="applicationFilter"><option value="all">全部状态</option><option value="pending">未投递</option><option value="applied">已投递</option><option value="later">暂不投</option></select></label></div>
<div class="board-summary"><span>显示 <b id="visibleCount">—</b> 家</span><span>待投递 <b id="pendingCount">—</b> 家</span><div class="legend"><span><i class="legend-dot baseline-dot"></i>首次基线</span><span><i class="legend-dot new-dot"></i>后来新确认 <b id="boardNew">—</b></span></div></div>
<p id="scanNotice" class="notice" role="status"></p><p id="baselineWarning" class="notice" role="status"></p>
<div id="applicationList" class="company-grid" aria-live="polite"></div>
<p class="muted board-explanation">橙色表示建立基线后新确认的企业，不代表当天才开始招聘。集团旗下单位、已结束和报名状态待核实会分别标明。</p>
</section>
<div class="tracker-tools"><span id="trackingNote" class="muted">投递标记保存在此浏览器，下次打开会记住。</span><button id="exportTracker">备份记录</button><button id="importTracker">恢复记录</button><input type="file" id="trackerFile" accept="application/json,.json" hidden><span id="trackingMessage" class="notice" role="status"></span></div>
<details class="directory"><summary>查看完整企业目录与日期证据</summary>
<div class="stats"><div class="stat"><strong id="total">—</strong><small>监控企业</small></div><div class="stat"><strong id="launched">—</strong><small>已确认2027届秋招启动</small></div><div class="stat"><strong id="dated">—</strong><small>已记录具体开启日期</small></div><div class="stat"><strong id="newly">—</strong><small>今天新确认启动</small></div></div>
<section class="panel filters"><input id="query" aria-label="搜索企业" placeholder="搜索企业名称"><select id="group" aria-label="企业类别"><option value="">所有企业</option><option>央企</option><option>银行</option><option>民营500</option></select><select id="bankType" aria-label="银行类型"><option value="">全部银行类型</option><option>政策性及开发性银行</option><option>国有大型商业银行</option><option>全国性股份制银行</option><option>城市商业银行</option></select><select id="status" aria-label="秋招情况"><option value="">全部状态</option><option value="launched">已确认秋招启动</option><option value="unknown">未检索到可靠记录</option></select></section>
<section class="panel"><div class="nav"><h2 id="month"></h2><div class="buttonline"><button id="prev">←</button><button id="today">今天</button><button id="next">→</button></div></div><div class="calendar" id="calendar"></div><div style="border-top:1px solid #e7ebf1;margin-top:17px;padding-top:13px"><h3 id="dayTitle"></h3><div id="dayList"></div></div></section>
<section class="panel"><h2>企业秋招状态</h2><p class="muted">“已启动”表示已有2027届招聘证据；无法确定真实开启日期的企业会从首次被确认那天开始出现在“每日新确认”中。</p><div id="list"></div></section>
</details><footer class="board-footer"><p class="muted" id="baselineNote"></p><p class="muted" id="updated"></p><p class="muted" id="health"></p><p class="muted">每日北京时间 08:40、20:40 自动开始检查，核验与发布完成后更新。</p></footer></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chinaToday(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const values=Object.fromEntries(parts.map(p=>[p.type,p.value]));return new Date(Number(values.year),Number(values.month)-1,Number(values.day))}
let companies=[],discoveryEvents=[],historyStatus="loading",shown=chinaToday(),selected=chinaToday();shown.setDate(1);
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const calendarDate=c=>c.open_date_evidence?.date===c.open_date&&c.open_date_evidence?.scope==="employer"?c.open_date:null;
const launched=c=>c.status==="已开启"||c.status==="已结束"||c.status==="已发布公告（网申待核验）"||Boolean(c.announcement_date);
function filtered(){const q=$("query").value.trim().toLowerCase(),group=$("group").value,bank=$("bankType").value,status=$("status").value;return companies.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!group||c.groups.includes(group))&&(!bank||c.bank_type===bank)&&(!status||(status==="launched"?launched(c):!launched(c))))}
function render(){const all=filtered();$("total").textContent=companies.length;$("launched").textContent=companies.filter(launched).length;$("dated").textContent=companies.filter(c=>calendarDate(c)).length;$("newly").textContent=historyStatus==="ready"?discoveryEvents.filter(e=>e.kind==="first_confirmed"&&e.date===iso(chinaToday())).length:"—";
$("list").innerHTML=all.map(c=>'<div class="result"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.groups.join("、"))+(c.bank_type?" · "+esc(c.bank_type):"")+'</div></div><div style="text-align:right"><span class="tag">'+(launched(c)?(["subsidiary","旗下单位"].includes(c.source_scope)?"旗下单位已启动":"2027秋招已启动"):"暂无可靠开启记录")+'</span><div class="muted" style="margin-top:6px">'+(calendarDate(c)?"开启 "+esc(calendarDate(c)):c.announcement_date?"公告 "+esc(c.announcement_date):"日期待发现")+'</div></div></div>').join("")||'<p class="muted">没有符合条件的企业。</p>';
renderCalendar(all);renderDashboard()}

const TRACKER_KEY="qiuzhao-2027-tracker-v1";
const validState=new Set(["applied","later"]);
let storageAvailable=true,tracker=readTracker();
function validateTracker(raw){
 if(!raw||raw.version!==1||typeof raw.applications!=="object"||raw.applications===null||Array.isArray(raw.applications)||!Array.isArray(raw.read_updates))throw Error("备份格式不正确");
 const clean={version:1,applications:Object.create(null),read_updates:[]};
 for(const [name,value] of Object.entries(raw.applications)){
  if(typeof name!=="string"||name.length>150||!value||!validState.has(value.state)||(typeof value.marked_at!=="string"||!Number.isFinite(Date.parse(value.marked_at))))throw Error("投递记录格式不正确");
  clean.applications[name]={state:value.state,marked_at:value.marked_at};
 }
 if(raw.read_updates.some(x=>typeof x!=="string"||x.length>400))throw Error("更新记录格式不正确");
 clean.read_updates=[...new Set(raw.read_updates)];return clean;
}
function readTracker(){try{const storage=globalThis.localStorage;storageAvailable=Boolean(storage);const raw=storage?.getItem(TRACKER_KEY);if(raw)return validateTracker(JSON.parse(raw))}catch(e){storageAvailable=false}return {version:1,applications:Object.create(null),read_updates:[]}}
function saveTracker(){
 try{if(!storageAvailable)throw Error("storage unavailable");globalThis.localStorage.setItem(TRACKER_KEY,JSON.stringify(tracker))}
 catch(e){storageAvailable=false;$("trackingMessage").textContent="记录暂时只能保留在当前页面，请导出备份。"}
}
const appliedState=name=>tracker.applications[name]?.state||"pending";
const eventId=e=>[e.kind,e.date,e.name,e.opening_date||""].join("|");
function updateItems(){
 const events=discoveryEvents.filter(e=>e.kind==="first_confirmed"||e.kind==="date_verified").map(e=>({...e}));
 for(const c of companies){const day=calendarDate(c),backfilled=events.some(e=>e.kind==="date_verified"&&e.name===c.name&&e.opening_date===day&&e.date>day);if(day&&!backfilled)events.push({kind:"opening",date:day,name:c.name,opening_date:day})}
 const validNames=new Set(companies.map(c=>c.name));
 return [...new Map(events.filter(e=>validNames.has(e.name)).map(e=>[eventId(e),e])).values()];
}
let baselineNames=new Set(),baselineStatus="loading",baselineCapturedAt="",boardCategory="";
const newlyConfirmed=c=>baselineStatus==="ready"&&launched(c)&&!baselineNames.has(c.name);
function companyRow(c){
 const state=appliedState(c.name),fresh=newlyConfirmed(c),ended=c.status==="已结束",child=["subsidiary","旗下单位"].includes(c.source_scope);
 const scope=child?"旗下单位已启动":"已确认2027届招聘";
 const availability=ended?"已记录结束，不列入待投递":c.status==="已开启"?"已有网申开启依据，请留意岗位截止情况":"已有招聘公告，当前可报名情况待自动核实";
 const name=encodeURIComponent(c.name);
 return '<article class="company-card'+(fresh?' new-company':'')+(ended?' ended':'')+'" data-name="'+esc(c.name)+'"><div><div class="card-heading"><b>'+esc(c.name)+'</b>'+(fresh?'<span class="new-badge">新确认</span>':'')+'</div><div class="card-meta">'+esc(c.groups.join(" · "))+' · '+esc(scope)+'<br>'+esc(availability)+'</div></div><div class="actions"><span class="application-state">'+(state==="applied"?"已投递":state==="later"?"暂不投":"未投递")+'</span><button data-action="applied" data-company="'+name+'"'+(state==="applied"?' class="active"':'')+'>标记已投递</button><button data-action="later" data-company="'+name+'"'+(state==="later"?' class="active"':'')+'>暂不投</button>'+(state!=="pending"?'<button data-action="pending" data-company="'+name+'">改回未投递</button>':'')+'</div></article>';
}
function renderDashboard(){
 const confirmed=companies.filter(launched);
 for(const [category,id] of [["","categoryAll"],["银行","categoryBanks"],["央企","categoryCentral"],["民营500","categoryPrivate"]])$(id).textContent=confirmed.filter(c=>!category||c.groups.includes(category)).length;
 const categoryCompanies=confirmed.filter(c=>!boardCategory||c.groups.includes(boardCategory));
 $("boardNew").textContent=baselineStatus==="ready"?categoryCompanies.filter(newlyConfirmed).length:"—";
 $("pendingCount").textContent=categoryCompanies.filter(c=>c.status!=="已结束"&&appliedState(c.name)==="pending").length;
 const range=$("boardRange").value||"all",state=$("applicationFilter").value||"all",query=$("boardQuery").value.trim().toLowerCase();
 let list=categoryCompanies.filter(c=>(!query||c.name.toLowerCase().includes(query))&&(state==="all"||appliedState(c.name)===state&&(state!=="pending"||c.status!=="已结束"))&&(range==="all"||baselineStatus==="ready"&&(range==="new"?newlyConfirmed(c):baselineNames.has(c.name))));
 list.sort((a,b)=>Number(newlyConfirmed(b))-Number(newlyConfirmed(a))||Number(a.status==="已结束")-Number(b.status==="已结束")||a.name.localeCompare(b.name,"zh-CN"));
 $("visibleCount").textContent=list.length;
 $("applicationList").innerHTML=list.length?list.map(companyRow).join(""):'<p class="muted section-empty">'+(baselineStatus!=="ready"&&range!=="all"?"基线暂未读取，无法区分新旧企业。请刷新结果。":"这个筛选下暂无已确认企业。未确认不代表尚未开招。")+'</p>';
 $("baselineWarning").textContent=baselineStatus==="failed"?"基线暂未读取成功，新旧标记暂不可用；已有企业和投递记录仍可查看。":"";
 $("baselineNote").textContent=baselineStatus==="ready"?"首次基线：截至 "+baselineCapturedAt+" 已确认的 "+baselineNames.size+" 家企业。基线固定，后续自动更新不会重置颜色。":"";
 if(!storageAvailable)$("trackingNote").textContent="浏览器暂不能保存记录；关闭页面前请备份记录。";
}
async function loadBaseline(){
 try{
  const response=await fetch("./data/launch_baseline.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("基线 HTTP "+response.status);const data=await response.json();
  if(data.schema_version!==1||!Array.isArray(data.known_launch_names)||data.known_launch_names.some(x=>typeof x!=="string")||typeof data.captured_at!=="string")throw Error("基线格式错误");
  baselineNames=new Set(data.known_launch_names);baselineCapturedAt=data.captured_at;baselineStatus="ready";
 }catch(error){baselineStatus="failed"}
 renderDashboard();
}
function handleApplicationClick(event){
 const button=event.target.closest?.("button[data-action]");if(!button)return;
 const name=decodeURIComponent(button.dataset.company),state=button.dataset.action;
 if(!companies.some(c=>c.name===name)||!["pending","applied","later"].includes(state))return;
 if(state==="pending")delete tracker.applications[name];else tracker.applications[name]={state,marked_at:new Date().toISOString()};
 if(state!=="pending")tracker.read_updates=[...new Set([...tracker.read_updates,...updateItems().filter(e=>e.name===name&&e.date<=iso(chinaToday())).map(eventId)])];
 saveTracker();renderDashboard();
}
for(const id of ["applicationList"])$(id).addEventListener("click",handleApplicationClick);
$("applicationFilter").addEventListener("change",renderDashboard);
$("boardRange").addEventListener("change",renderDashboard);$("boardQuery").addEventListener("input",renderDashboard);
document.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>{boardCategory=button.dataset.category;document.querySelectorAll("[data-category]").forEach(item=>item.setAttribute("aria-pressed",String(item.dataset.category===boardCategory)));renderDashboard()}));
$("exportTracker").onclick=()=>{const blob=new Blob([JSON.stringify(tracker,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="2027秋招投递记录-"+iso(chinaToday())+".json";link.click();URL.revokeObjectURL(url)};
$("importTracker").onclick=()=>$("trackerFile").click();
$("trackerFile").addEventListener("change",async event=>{
 try{const file=event.target.files?.[0];if(!file)return;if(file.size>1024*1024)throw Error("备份文件过大");const incoming=validateTracker(JSON.parse(await file.text()));
  const merged={...tracker.applications};for(const [name,value] of Object.entries(incoming.applications)){const old=merged[name];if(!old||Date.parse(value.marked_at)>=Date.parse(old.marked_at))merged[name]=value}
  tracker.applications=merged;tracker.read_updates=[...new Set([...tracker.read_updates,...incoming.read_updates])];saveTracker();renderDashboard();$("trackingMessage").textContent=storageAvailable?"已合并投递记录，保留较新的标记。":"已导入；浏览器无法保存，请保留备份。";
 }catch(error){$("trackingMessage").textContent="导入失败："+error.message}finally{event.target.value=""}
});
globalThis.addEventListener?.("storage",event=>{if(event.key===TRACKER_KEY){tracker=readTracker();renderDashboard()}});

function renderCalendar(all){
 const year=shown.getFullYear(),month=shown.getMonth(),first=new Date(year,month,1).getDay();
 $("month").textContent=year+"年"+(month+1)+"月";
 const names=new Set(all.map(c=>c.name));
 let html="";
 for(const x of "日一二三四五六")html+='<div class="weekday">周'+x+'</div>';
 for(let i=0;i<42;i++){
  const d=new Date(year,month,i-first+1),day=iso(d),inMonth=d.getMonth()===month;
  const started=all.filter(c=>calendarDate(c)===day),newFound=discoveryEvents.filter(e=>e.kind==="first_confirmed"&&e.date===day&&names.has(e.name));
  html+='<button type="button" class="day'+(inMonth?"":" out")+(day===iso(selected)?" selected":"")+'" data-date="'+day+'">'+d.getDate()+
   (started.length?'<span class="count">'+started.length+'家确切开启</span>':"")+
   (newFound.length?'<span class="newcount">'+newFound.length+'家新确认</span>':"")+
   '</button>';
 }
 $("calendar").innerHTML=html;
 document.querySelectorAll(".day").forEach(el=>el.addEventListener("click",()=>{const [y,m,d]=el.dataset.date.split("-").map(Number);selected=new Date(y,m-1,d);shown=new Date(y,m-1,1);render()}));
 const day=iso(selected),started=all.filter(c=>calendarDate(c)===day),newFound=discoveryEvents.filter(e=>e.kind==="first_confirmed"&&e.date===day&&names.has(e.name));
 $("dayTitle").textContent=day+" · 确切开启 "+started.length+" 家 · 新确认 "+newFound.length+" 家";
 let out='<h4>当天确切开启秋招</h4>';
 out+=started.length?started.map(c=>'<div class="result"><b>'+esc(c.name)+'</b><span class="tag">'+esc(c.groups.join("、"))+'</span></div>').join(""):'<p class="muted">暂无已核实的实际开启日期。</p>';
 out+='<h4>当天新确认已启动（并非实际开启日）</h4>';
 out+=newFound.length?newFound.map(e=>'<div class="result"><b>'+esc(e.name)+'</b><span class="tag">首次确认'+(e.opening_date?' · 实际开启 '+esc(e.opening_date):' · 开启日仍待明确')+'</span></div>').join(""):'<p class="muted">没有新确认记录。既有企业不会被重复记为当天新确认。</p>';
 $("dayList").innerHTML=out;
}
$("prev").onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);selected=new Date(shown);render()};
$("next").onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);selected=new Date(shown);render()};
$("today").onclick=()=>{selected=chinaToday();shown=new Date(selected.getFullYear(),selected.getMonth(),1);render()};
["query","group","bankType","status"].forEach(id=>$(id).addEventListener(id==="query"?"input":"change",render));
let inflight=false;
async function loadLatest(){
 if(inflight)return;
 inflight=true;
 const btn=$("refreshNow");btn.disabled=true;btn.textContent="正在获取…";
 try{
  // GitHub Pages static data is the stable daily snapshot; cache-bust each visit.
  const response=await fetch("./data/companies.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("站点数据 HTTP "+response.status);
  const data=await response.json();
  if(!Array.isArray(data.companies)||data.companies.length<1)throw Error("企业数据为空");
  companies=data.companies;
  $("updated").textContent="最新数据："+(data.generated_at||"未知")+" · 本次读取 "+new Date().toLocaleTimeString("zh-CN",{timeZone:"Asia/Shanghai"});
  render();
 }catch(err){
  // Alternate source if Pages deployment/CDN is temporarily unavailable.
  try{
   const response=await fetch("https://api.github.com/repos/lmy930/lmy_qiuzhao/contents/data/companies.json?ref=main&t="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
   if(!response.ok)throw Error("备选数据 HTTP "+response.status);
   const raw=await response.json();
   const data=raw.companies?raw:JSON.parse(decodeURIComponent(Array.from(atob(raw.content.replace(/\s/g,"")),ch=>"%"+ch.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
   if(!Array.isArray(data.companies)||!data.companies.length)throw Error("备选数据为空");
   companies=data.companies;
   $("updated").textContent="已从备选源加载："+(data.generated_at||"未知");
   $("health").textContent="网站数据读取暂时失败，已切换 GitHub 数据源。";
   render();
  }catch(fallback){
   $("health").textContent="数据未能加载："+err.message+"；备选也失败："+fallback.message+"。请稍后重试。";
   $("applicationList").innerHTML='<p class="section-empty">企业信息暂未加载成功，请稍后刷新。已保存的投递记录不会丢失。</p>';
   $("total").textContent="加载失败";
   $("launched").textContent="—";
   $("dated").textContent="—";
  }
 }finally{inflight=false;btn.disabled=false;btn.textContent="刷新结果"}
}
async function loadHistory(){
 try{
  const response=await fetch("./data/daily_changes.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  const history=await response.json();
  if(!Array.isArray(history.events))throw Error("更新记录格式错误");
  discoveryEvents=history.events;historyStatus="ready";
  render();
 }catch(e){
  historyStatus="failed";$("trackingMessage").textContent="每日更新记录暂未读取成功，请重新加载。";
  if(companies.length)render();
 }
}
$("refreshNow").onclick=async()=>{await loadLatest();await loadHistory();await loadBaseline();await loadScanHealth()};
renderCalendar([]);renderDashboard();
$("total").textContent="加载中";
$("launched").textContent="—";
$("dated").textContent="—";
loadLatest();loadHistory();loadBaseline();loadScanHealth();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadLatest();loadHistory();loadScanHealth()}});
setInterval(()=>{if(!document.hidden){loadLatest();loadHistory();loadScanHealth()}},120000);
async function loadScanHealth(){
 try{
  const response=await fetch("./data/page_verification_report.json?t="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("扫描报告未读取");const report=await response.json();
  if(!report.scanned_at)throw Error("扫描报告缺少日期");
  const checked=new Date(report.scanned_at),date=checked.toLocaleDateString("en-CA",{timeZone:"Asia/Shanghai"}),stamp=checked.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"});
  $("health").textContent="最近核验："+stamp+"（北京时间）。未发现记录不代表企业没有招聘。";
  $("scanNotice").textContent=report.pages_attempted>0&&report.pages_read===0?"最近核验未能读取来源页面；当前显示已保存结果，自动更新暂受影响。":date!==iso(chinaToday())?"今天的核验结果尚未更新，当前展示最近保存的信息。":report.pages_read<report.pages_attempted?"部分来源暂未读取成功，已保留既有信息。":"";
 }catch(error){$("scanNotice").textContent="暂未读取核验进度，当前展示已保存信息。";$("health").textContent="核验报告暂未读取成功。"}
}
