<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 秋招雷达</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152238}.wrap{max-width:1250px;margin:auto;padding:25px}header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px;align-items:center}h1{margin:0;font-size:29px}p{color:#64748b}.panel,.tile{background:white;border:1px solid #e3e8ef;border-radius:15px;padding:18px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile strong{display:block;font-size:27px}.tile small{color:#64748b}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:10px;border:1px solid #dce3eb;border-radius:9px;background:white}input{flex:1;min-width:200px}button{cursor:pointer}button:hover{background:#eef4ff}.calhead{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:#718096;font-size:12px;padding:10px}.day{border:1px solid #e7ecf2;border-radius:8px;min-height:82px;padding:6px;overflow:hidden;cursor:pointer;background:white;text-align:left;font:inherit;color:inherit;width:100%}.day:hover{background:#edf4ff;border-color:#8cacfc}.day.selected{background:#e4edff;border:2px solid #456dde}.day:focus-visible{outline:3px solid #345fdf;outline-offset:2px}.date-results{display:grid;gap:10px;margin-top:12px}.date-card{padding:12px;border:1px solid #e5eaf2;border-radius:10px;background:#fbfcff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.date-card a{display:inline-block;margin-left:12px}.date-card small{color:#64748b}.outside{opacity:.35}.today{border:2px solid #4c6fff}.event{font-size:11px;background:#e9f2ff;border-radius:4px;padding:3px;margin-top:3px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.muted{color:#64748b}.tablebox{max-height:550px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e9edf3;padding:10px}th{position:sticky;top:0;background:white}a{color:#285ec7}#detail{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px}#detail.show{display:flex}.modal{background:white;padding:24px;border-radius:16px;width:min(520px,100%)}.tip{font-size:13px;background:#fff8e8;border:1px solid #f8e1aa;padding:12px;border-radius:9px;margin:14px 0}@media(max-width:650px){.wrap{padding:13px}h1{font-size:23px}.day{min-height:65px;padding:3px}.stats{gap:6px}.tile{padding:10px}.tile strong{font-size:21px}.calendar{gap:2px}}
</style></head><body><div class="wrap"><header><div><h1>2027 秋招雷达</h1><p>央企 · 银行 · 民营500强 · 秋招开启日历</p></div><span id="updated" class="muted"></span></header><div class="tip">网站已部署初版。企业名单正在分批导入，招聘状态与开放日期必须核对官方公告后才显示；“待核验”不等于未招聘。每日自动核验尚在配置中。</div><section class="stats"><div class="tile"><strong id="total">—</strong><small>已导入企业</small></div><div class="tile"><strong id="open">—</strong><small>已核实开启</small></div><div class="tile"><strong id="pending">—</strong><small>待核验</small></div></section><section class="panel controls"><input id="query" placeholder="搜索企业名称"><select id="group"><option value="">全部类别</option><option>央企</option><option>银行</option><option>民营500</option></select><select id="bankType"><option value="">全部银行类别</option><option>政策性及开发性银行</option><option>国有大型商业银行</option><option>全国性股份制银行</option><option>城市商业银行</option></select><select id="status"><option value="">全部状态</option><option>已开启</option><option>即将开启</option><option>已结束</option><option>待核验</option></select></section><section class="panel"><div class="calhead"><h2 id="month"></h2><div><button onclick="move(-1)">←</button><button onclick="reset()">今天</button><button onclick="move(1)">→</button></div></div><div id="calendar" class="calendar"></div><div id="dayResults" aria-live="polite" style="margin-top:16px;padding-top:14px;border-top:1px solid #e6ebf2"><h3 id="selectedHeading" style="margin:0 0 4px"></h3><p class="muted" style="margin:3px 0;font-size:13px">点击任意日期，查看当天经核验的秋招开启企业。日期以公告确认的开启日为准。</p><div id="selectedCompanies" class="date-results"></div></div></section><section class="panel"><h2>每日发现的招聘线索 <small class="muted" style="font-size:12px;font-weight:normal">（未经官方核验，不代表已经开启）</small></h2><p id="leadStatus" class="muted">等待首次定时扫描</p><div id="leadList" style="display:grid;gap:8px"></div></section><section class="panel"><h2>企业列表</h2><div class="tablebox"><table><thead><tr><th>企业</th><th>类别</th><th>银行类型</th><th>状态</th><th>开启日期</th><th>截止日期</th><th>官方来源 / 网申</th></tr></thead><tbody id="rows"></tbody></table></div></section><p style="font-size:12px">招聘信息以企业官方公告为准；首次开启日期与公告发现日期严格区分，未经核实不填入日历。</p></div><div id="detail" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal"><button style="float:right" onclick="document.getElementById('detail').classList.remove('show')">关闭</button><div id="detailContent"></div></div></div><script>
fetch('data/leads.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error('扫描结果尚未生成');return r.json()}).then(d=>{let el=document.getElementById('leadList');document.getElementById('leadStatus').textContent='最近扫描：'+(d.scanned_at||'—')+'｜成功 '+(d.searches_succeeded??0)+' / '+(d.searches_attempted??0)+' 家｜线索仅供复核';el.innerHTML=(d.leads||[]).slice(0,30).map(c=>'<div style="padding:10px;background:#f7f9fd;border-radius:8px"><b>'+esc(c.name)+'</b> · <span class="muted">'+esc(c.last_found)+'</span><div>'+((c.hits||[]).slice(0,2).map(h=>'<a target="_blank" rel="noopener" href="'+encodeURI(h.url)+'">'+esc(h.title)+'</a>').join(' · '))+'</div></div>').join('')||'暂未发现符合检索条件的线索'}).catch(e=>{document.getElementById('leadStatus').textContent=e.message});
let companies=[],cursor=new Date(),selectedDate=new Date();cursor.setDate(1);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function filtered(){let q=$('query').value.trim().toLowerCase(),g=$('group').value,s=$('status').value,b=$('bankType').value;return companies.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(!g||c.groups.includes(g))&&(!b||c.bank_type===b)&&(!s||c.status===s))}function render(){let x=filtered();$('total').textContent=companies.length;$('open').textContent=companies.filter(c=>c.status==='已开启').length;$('pending').textContent=companies.filter(c=>c.status==='待核验').length;$('rows').innerHTML=x.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.groups.join('、'))+'</td><td>'+esc(c.bank_type||'—')+'</td><td>'+esc(c.status)+'</td><td>'+esc(c.open_date||'—')+'</td><td>'+esc(c.deadline||'—')+'</td><td>'+(c.source_url?'<a target="_blank" rel="noopener" href="'+encodeURI(c.source_url)+'">公告</a>':'—')+(c.apply_url?' · <a target="_blank" rel="noopener" href="'+encodeURI(c.apply_url)+'">网申</a>':'')+'</td></tr>').join('');renderCal(x)}function dateIso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function selectDate(iso){const p=iso.split('-').map(Number);selectedDate=new Date(p[0],p[1]-1,p[2]);cursor=new Date(p[0],p[1]-1,1);render()}
function renderDayResults(x){const date=dateIso(selectedDate),matches=x.filter(c=>c.open_date===date);
$('selectedHeading').textContent=date.replace(/-/g,'/')+' · 当日开启 '+matches.length+' 家';
$('selectedCompanies').innerHTML=matches.length?matches.map(c=>'<div class="date-card"><div><strong>'+esc(c.name)+'</strong><div><small>'+esc(c.groups.join('、'))+(c.bank_type?' · '+esc(c.bank_type):'')+' · 当前状态：'+esc(c.status)+' · 截止：'+esc(c.deadline||'待公布')+'</small></div></div><div>'+(c.source_url?'<a href="'+esc(c.source_url)+'" target="_blank" rel="noopener noreferrer">官方公告 ↗</a>':'')+(c.apply_url?'<a href="'+esc(c.apply_url)+'" target="_blank" rel="noopener noreferrer">网申入口 ↗</a>':'')+'</div></div>').join(''):'<p class="muted">目前没有已核验为这一天开启秋招的企业。注意：这不代表当天没有企业开启招聘，可能仍有公告尚未核验。</p>'}
function renderCal(x){const y=cursor.getFullYear(),m=cursor.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();let html='';$('month').textContent=y+'年'+(m+1)+'月';
for(const d of '日一二三四五六')html+='<div class="dow">周'+d+'</div>';
for(let i=0;i<42;i++){const d=i-first+1,date=new Date(y,m,d),iso=dateIso(date),inMonth=d>=1&&d<=days,events=x.filter(c=>c.open_date===iso);
html+='<button type="button" class="day'+(inMonth?'':' outside')+(iso===dateIso(selectedDate)?' selected':'')+'" data-date="'+iso+'" aria-label="'+iso+'开启'+events.length+'家" aria-pressed="'+(iso===dateIso(selectedDate))+'"><small>'+date.getDate()+'</small>';
for(const c of events.slice(0,2))html+='<div class="event" title="'+esc(c.name)+'">'+esc(c.name)+'</div>';
if(events.length>2)html+='<div class="muted" style="font-size:11px;margin-top:4px">另有 '+(events.length-2)+' 家</div>';
html+='</button>'}
$('calendar').innerHTML=html;
document.querySelectorAll('.day[data-date]').forEach(el=>el.addEventListener('click',()=>selectDate(el.dataset.date)));
renderDayResults(x)}
function move(n){cursor.setMonth(cursor.getMonth()+n);render()}function reset(){selectedDate=new Date();cursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);render()}['query','group','bankType','status'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));fetch('data/companies.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error('暂无数据');return r.json()}).then(d=>{companies=d.companies||[];$('updated').textContent='数据版本：'+(d.generated_at||'待核验');render()}).catch(e=>{$('updated').textContent='数据读取失败：'+e.message;render()});
</script></body></html>
