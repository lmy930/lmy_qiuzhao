name: Recruitment pipeline checks
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pipeline-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Check name and 2027 evidence tests
        run: python -m unittest discover -s tests -v
