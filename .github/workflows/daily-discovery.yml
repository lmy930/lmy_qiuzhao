name: Daily recruitment discovery
on:
  schedule:
    - cron: '40 0 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/source_catalog.json'
      - '.github/workflows/daily-discovery.yml'
permissions:
  contents: write
concurrency:
  group: daily-discovery
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect possible recruitment leads
        continue-on-error: true
        run: python scripts/discover.py
      - name: Read public recruitment aggregator listings
        continue-on-error: true
        run: python scripts/aggregate_sources.py
      - name: Direct scan of official government recruitment listings
        run: python scripts/government_sources.py
      - name: Scan university recruiting announcement archives
        continue-on-error: true
        run: python scripts/university_sources.py
      - name: Automatically verify discovered 2027 recruitment pages
        continue-on-error: true
        run: python scripts/promote_evidence.py
      - name: Verify allowlisted official recruitment sources
        continue-on-error: true
        run: python scripts/verify_official.py
      - name: Commit discovery and official verification reports when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json data/companies.json data/verification_report.json data/auto_verification_report.json data/government_scan_report.json data/university_scan_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh recruitment discovery leads"
            git push
          fi
