name: Daily recruitment discovery
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * 1-6'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      historical_backfill:
        description: Deep scan public recruitment archives
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-discovery
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.historical_backfill || github.event.schedule == '0 14 * * 0') && 90 || 35 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Visit employer websites and multiple public recruitment archives
        env:
          HISTORICAL_BACKFILL: ${{ inputs.historical_backfill || github.event.schedule == '0 14 * * 0' }}
        run: |
          if [ "$HISTORICAL_BACKFILL" = "true" ]; then
            python scripts/broad_sources.py --backfill
          else
            python scripts/broad_sources.py
          fi
      - name: Collect possible recruitment leads
        run: python scripts/discover.py
      - name: Read public recruitment aggregator listings
        continue-on-error: true
        run: python scripts/aggregate_sources.py
      - name: Direct scan of official government recruitment listings
        run: python scripts/government_sources.py
      - name: Scan university recruiting announcement archives
        continue-on-error: true
        run: python scripts/university_sources.py
      - name: Verify allowlisted official recruitment sources
        continue-on-error: true
        run: python scripts/verify_official.py
      - name: Read evidence pages and backfill explicit application dates
        run: python scripts/verify_pages.py
      - name: Reconcile verified recruitment evidence
        run: python scripts/promote_evidence.py
      - name: Record newly confirmed companies and evidence changes
        run: |
          python scripts/update_daily_changes.py
          python scripts/report_coverage.py
      - name: Validate scan output
        run: |
          python -m unittest discover -s tests -v
          node tests/check_frontend.mjs
          node tests/check_dashboard.mjs
      - name: Preserve scan diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-scan-reports
          path: data/*report.json
      - name: Commit discovery and official verification reports when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json data/companies.json data/verification_report.json data/auto_verification_report.json data/government_scan_report.json data/university_scan_report.json data/daily_changes.json data/page_verification_report.json data/broad_source_report.json data/coverage_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh recruitment discovery leads"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Automatic merge conflict in recruitment data; preserving remote edits."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Recruitment updates successfully published."
                exit 0
              fi
              echo "Concurrent GitHub push detected; retrying (attempt $attempt)."
              sleep 3
            done
            exit 1
          fi
  publish:
    needs: scan
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-site.yml
