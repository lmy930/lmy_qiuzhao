name: Daily recruitment discovery
on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-discovery
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect possible recruitment leads
        run: python scripts/discover.py
      - name: Commit discovery report when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh recruitment discovery leads"
            git push
          fi
