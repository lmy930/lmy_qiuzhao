name: Check recruitment source access
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure platform and additional university entry access
        run: python scripts/check_source_access.py
      - name: Save measured access report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_access_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Measure recruitment source access on GitHub runner"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
